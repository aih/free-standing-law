gap":10},{"d":1,"s":[["=","(e) Property and facilities"]]},{"d":2,"s":[["=","(1) The Retirement Home shall include such property and facilities as may be acquired under paragraph (2) or accepted under section 415(f) of this title for inclusion in the Retirement Home."]]},{"d":2,"s":[["=","(2) The"],["-","Secretary of Defense"],["+","Chief Operating Officer"],["=","may acquire, for the benefit of the Retirement Home, property and facilities for inclusion in the Retirement Home. If the purchase price to acquire fee title to real property for inclusion in the Retirement Home is more than $750,000, the"],["-","Secretary"],["+","Chief Operating Officer"],["=","may acquire the real property only if the acquisition is specifically authorized by law."]]},{"d":2,"s":[["=","(3) If the"],["-","Secretary of Defense"],["+","Chief Operating Officer"],["=","determines that any property of the Retirement Home is excess to the needs of the Retirement Home, the"],["-","Secretary"],["+","Chief Operating Officer"],["=","shall dispose of the property in accordance with subchapter III of chapter 5 of title 40 (40 U.S.C. 541 et seq.). The proceeds from the disposal of property under this paragraph shall be deposited in the Armed Forces Retirement Home Trust Fund."]]},{"d":1,"s":[["=","(f) Department of Defense support"]]},{"d":1,"s":[["=","The Secretary of Defense may make available from the Department of Defense to the Retirement Home, on a nonreimbursable basis, administrative support and office services, legal and policy planning assistance, access to investigative facilities of the Inspector General of the Department of Defense and of the military departments, and any other support necessary to enable the Retirement Home to carry out its functions under this chapter."]]},{"gap":3},{"d":1,"s":[["=","The Secretary of Defense shall transmit to Congress an annual report on the financial and other affairs of the Retirement Home for each fiscal year. The annual report shall include an assessment of all aspects of each facility of the Retirement Home, including the quality of care at the facility."]]},{"d":1,"s":[["=","(i) Authority to lease non-excess property"]]},{"d":2,"s":[["=","(1)"],["-","Whenever"],["+","Subject to the approval of the Secretary of Defense, whenever"],["=","the Chief Operating Officer of the Armed Forces Retirement Home considers it advantageous to the Retirement Home, the"],["-","Secretary of Defense (acting on behalf of the"],["=","Chief Operating"],["-","Officer)"],["+","Officer"],["=","may lease to such lessee and upon such terms as the"],["-","Secretary"],["+","Chief Operating Officer"],["=","considers will promote the purpose and financial stability of the Retirement Home or be in the public interest, real or personal property that is—"]]},{"d":3,"s":[["=","(A) under the control of the Retirement Home; and"]]},{"d":3,"s":[["=","(B) not excess property (as defined by section 102 of title 40) subject to disposal under subsection (e)(3)."]]},{"gap":12},{"d":3,"s":[["=","(E) Provision of such other services relating to activities that will occur on the leased property as the Chief Operating Officer considers appropriate."]]},{"d":2,"s":[["=","(4) In-kind consideration under paragraph (3) may be accepted at any property or facilities of the Retirement Home that are selected for that purpose by the Chief Operating Officer."]]},{"d":2,"s":[["=","(5) In the case of a lease for which all or part of the consideration proposed to be accepted under this subsection is in-kind consideration with a value in excess of $500,000, the"],["-","Secretary of Defense"],["+","Chief Operating Officer"],["=","may not enter into the lease"],["-","on behalf of the Chief Operating Officer"],["=","until at least 30 days after the date on which a report on the facts of the lease is submitted to Congress. This paragraph does not apply to a lease covered by paragraph (6)."]]},{"d":2,"s":[["=","(6)"]]},{"d":3,"s":[["=","(A) If a proposed lease under this subsection involves only personal property, the lease term exceeds one year, or the fair market value of the lease interest exceeds $100,000, as determined by the Chief Operating Officer, the"],["-","Secretary of Defense"],["+","Chief Operating Officer"],["=","shall use competitive procedures to select the lessee unless the Chief Operating Officer determines that—"]]},{"d":4,"s":[["=","(i) a public interest will be served as a result of the lease; and"]]},{"d":4,"s":[["=","(ii) the use of competitive procedures for the selection of certain lessees is unobtainable or not compatible with the public benefit served under clause (i)."]]},{"gap":3},{"d":2,"s":[["=","(7) The proceeds from the lease of property under this subsection shall be deposited in the Armed Forces Retirement Home Trust Fund."]]},{"d":2,"s":[["=","(8) The interest of a lessee of property leased under this subsection may be taxed by State or local governments. A lease under this subsection shall provide that, if and to the extent that the leased property is later made taxable by State or local governments under an Act of Congress, the lease shall be renegotiated."]]}]}],"net_redline":null,"rank":22},{"title":"11","identifier":"/us/usc/t11/s109","num":"§ 109.","heading":"Who may be a debtor","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":10,"text_versions":4,"text_changes":3,"churn":56,"substantive_churn":56,"substantive_changes":2,"editorial_changes":0,"inserted":28,"deleted":28,"net_churn":0,"words_first":1273,"words_last":1273,"relative_churn":0.044,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":1273},{"release":"116-56","date":"2019-08-23","kind":"text","status":null,"attribution":"none","laws":[],"words":1273},{"release":"117-151","date":"2022-06-21","kind":"text","status":null,"attribution":"classified","laws":["117-151"]," able effort, to participate in an in person, telephone, or Internet briefing required under paragraph (1)."]]}],"rank":23},{"title":"11","identifier":"/us/usc/t11/s707","num":"§ 707.","heading":"Dismissal of a case or conversion to a case under chapter 11 or 13","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":12,"text_versions":3,"text_changes":2,"churn":55,"substantive_churn":55,"substantive_changes":1,"editorial_changes":0,"inserted":55,"deleted":0,"net_churn":55,"words_first":2741,"words_last":2796,"relative_churn":0.0197,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":2741},{"release":"113-296not287not291","date":"2014-12-19","kind":"text","status":null,"attribution":"classified","laws":["113-295"],"words":2796},{"release":"116-56","date":"2019-08-23","kind":"text","status":null,"attribution":"none","laws":["116-53"],"words":2796}],"transitions":[{"from":"113-21","to":"113-296not287not291","date":"2014-12-19","inserted":55,"deleted":0,"churn":55,"words_before":2741,"words_after":2796,"status_before":null,"status_after":null,"attribution":"classified","laws":["113-295"],"caveat":"Current through Public Law 113-296 (12/19/2014), except 113-287, 113-291.","editorial":false,"redline":[{"d":0,"s":[["=","§ 707. Dismissal of a case or conversion to a case under chapter 11 or 13"]]},{"d":1,"s":[["=","(a) The court may dismiss a case under this chapter only after notice and a hearing and only for cause, including—"]]},{"gap":10},{"d":4,"s":[["=","(ii)"]]},{"d":5,"s":[["=","(I) The debtor’s monthly expenses shall be the debtor’s applicable monthly expense amounts specified under the National Standards and Local Standards, and the debtor’s actual monthly expenses for the categories specified as Other Necessary Expenses issued by the Internal Revenue Service for the area in which the debtor resides, as in effect on the date of the order for relief, for the debtor, the dependents of the debtor, and the spouse of the debtor in a joint case, if the spouse is not otherwise a dependent. Such expenses shall include reasonably necessary health insurance, disability insurance, and health savings account expenses for the debtor, the spouse of the debtor, or the dependents of the debtor. Notwithstanding any other provision of this clause, the monthly expenses of the debtor shall not include any payments for debts. In addition, the debtor’s monthly expenses shall include the debtor’s reasonably necessary expenses incurred to maintain the safety of the debtor and the family of the debtor from family violence as identified under section 302 of the Family Violence Prevention and Services Act, or other applicable Federal law. The expenses included in the debtor’s monthly expenses described in the preceding sentence shall be kept confidential by the court. In addition, if it is demonstrated that it is reasonable and necessary, the debtor’s monthly expenses may also include an additional allowance for food and clothing of up to 5 percent of the food and clothing categories as specified by the National Standards issued by the Internal Revenue Service."]]},{"d":5,"s":[["=","(II) In addition, the debtor’s monthly expenses may include, if applicable, the continuation of actual expenses paid by the debtor that are reasonable and necessary for care and support of an elderly, chronically ill, or disabled household member or member of the debtor’s immediate family (including parents, grandparents, siblings, children, and grandchildren of the debtor, the dependents of the debtor, and the spouse of the debtor in a joint case who is not a dependent) and who is unable to pay for such reasonable and necessary expenses."],["+","Such monthly expenses may include, if applicable, contributions to an account of a qualified ABLE program to the extent such contributions are not excess contributions (as described in section 4973(h) of the Internal Revenue Code of 1986) and if the designated beneficiary of such account is a child, stepchild, grandchild, or stepgrandchild of the debtor."]]},{"d":5,"s":[["=","(III) In addition, for a debtor eligible for chapter 13, the debtor’s monthly expenses may include the actual administrative expenses of administering a chapter 13 plan for the district in which the debtor resides, up to an amount of 10 percent of the projected plan payments, as determined under schedules issued by the Executive Office for United States Trustees."]]},{"d":5,"s":[["=","(IV) In addition, the debtor’s monthly expenses may include the actual expenses for each dependent child less than 18 years of age, not to exceed $1,500 per year per child, to attend a private or public elementary or secondary school if the debtor provides documentation of such expenses and a detailed explanation of why such expenses are reasonable and necessary, and why such expenses are not already accounted for in the National Standards, Local Standards, or Other Necessary Expenses referred to in subclause (I)."]]},{"gap":76},{"d":2,"s":[["=","(2) Except as provided in paragraph (3), after notice and a hearing, the court, on a motion by the victim of a crime of violence or a drug trafficking crime, may when it is in the best interest of the victim dismiss a voluntary case filed under this chapter by a debtor who is an individual if such individual was convicted of such crime."]]},{"d":2,"s":[["=","(3) The court may not dismiss a case under paragraph (2) if the debtor establishes by a preponderance of the evidence that the filing of a case under this chapter is necessary to satisfy a claim for a domestic support obligation."]]}]},{"from":"113-296not287not291","to":"116-56","date":"2019-08-23","inserted":0,"deleted":0,"churn":0,"words_before":2796,"words_after":2796,"status_before":null,"status_after":null,"attribution":"none","laws":["116-53"],"caveat":null,"editorial":false etermined under schedules issued by the Executive Office for United States Trustees."]]},{"d":5,"s":[["=","(IV) In addition, the debtor’s monthly expenses may include the actual expenses for each dependent child less than 18 years of age, not to exceed $1,500 per year per child, to attend a private or public elementary or secondary school if the debtor provides documentation of such expenses and a detailed explanation of why such expenses are reasonable and necessary, and why such expenses are not already accounted for in the National Standards, Local Standards, or Other Necessary Expenses referred to in subclause (I)."]]},{"gap":76},{"d":2,"s":[["=","(2) Except as provided in paragraph (3), after notice and a hearing, the court, on a motion by the victim of a crime of violence or a drug trafficking crime, may when it is in the best interest of the victim dismiss a voluntary case filed under this chapter by a debtor who is an individual if such individual was convicted of such crime."]]},{"d":2,"s":[["=","(3) The court may not dismiss a case under paragraph (2) if the debtor establishes by a preponderance of the evidence that the filing of a case under this chapter is necessary to satisfy a claim for a domestic support obligation."]]}],"rank":24},{"title":"24","identifier":"/us/usc/t24/s416","num":"§ 416.","heading":"Advisory Council","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":6,"text_versions":3,"text_changes":2,"churn":48,"substantive_churn":48,"substantive_changes":2,"editorial_changes":0,"inserted":4,"deleted":44,"net_churn":48,"words_first":833,"words_last":793,"relative_churn":0.0576,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":833},{"release":"115-117","date":"2018-01-12","kind":"text","status":null,"attribution":"classified","laws":["115-91"],"words":815},{"release":"116-344", e"]]},{"d":1,"s":[["=","(a) In General.— If the United States trustee has appointed an individual under section 586(b) of title 28 to serve as standing trustee in cases under this subchapter, and if such individual qualifies as a trustee under section 322 of this title, then that individual shall serve as trustee in any case under this subchapter. Otherwise, the United States trustee shall appoint one disinterested person to serve as trustee in the case or the United States trustee may serve as trustee in the case, as necessary."]]},{"gap":7},{"d":3,"s":[["=","(D) the sale of property of the estate;"]]},{"d":2,"s":[["=","(4) ensure that the debtor commences making timely payments required by a plan confirmed under this subchapter;"]]},{"d":2,"s":[["=","(5) if the debtor ceases to be a debtor in"],["-","possession,"],["+","possession—"]]},{"d":2,"s":[["+","(A)"],["=","perform the duties specified in section 704(a)(8) and paragraphs (1), (2), and (6) of section 1106(a) of this"],["-","title, including operating"],["+","title; and"]]},{"d":2,"s":[["+","(B) be authorized to operate"],["=","the business of the debtor;"]]},{"d":2,"s":[["=","(6) if there is a claim for a domestic support obligation with respect to the debtor, perform the duties specified in section 704(c) of this title; and"]]},{"d":2,"s":[["=","(7) facilitate the development of a consensual plan of reorganization."]]},{"d":1,"s":[["=","(c) Termination of Trustee Service.—"]]},{"d":2,"s":[["=","(1) In general.— If the plan of the debtor is confirmed under section 1191(a) of this title, the service of the trustee in the case shall terminate when the plan has been substantially consummated, except that the United States trustee may reappoint a trustee as needed for performance of duties under subsection (b)(3)(C) of this section and section 1185(a) of this title."]]},{"d":2,"s":[["=","(2) Service of notice of substantial consummation.— Not later than 14 days after the plan of the debtor is substantially consummated, the debtor shall file with the court and serve on the trustee, the United States trustee, and all parties in interest notice of such substantial consummation."]]}]}],"net_redline":null,"rank":36},{"title":"24","identifier":"/us/usc/t24/s423","num":"§ 423.","heading":"Preservation of historic buildings and grounds at the Armed Forces Retirement Home—Washington","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":5,"text_versions":2,"text_changes":1,"churn":12,"substantive_churn":12,"substantive_changes":1,"editorial_changes":0,"inserted":3,"deleted":9,"net_churn":12,"words_first":250,"words_last":244,"relative_churn":0.048,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":250},{"release":"113-296not287","date":"2014-12-19","kind":"text","status":null,"attribution":"none","laws":[],"words":244}],"transitions":[{"from":"113-21","to":"113-296not287","date":"2014-12-19","inserted":3,"deleted":9,"churn":12,"words_before":250,"words_after":244,"status_before":null,"status_after":null,"attribution":"none","laws":[],"caveat":"Current through Public Law 113-296 (12/19/2014), except 113-287.","editorial":false,"redline":[{"d":0,"s":[["=","§ 423. Preservation of historic buildings and grounds at the Armed Forces Retirement Home—Washington"]]},{"d":1,"s":[["=","(a) Historic nature of facility Congress finds the following:"]]},{"d":2,"s":[["=","(1) Four buildings located on six acres of the establishment of the Retirement Home known as the Armed Forces Retirement Home—Washington are included on the National Register of Historic Places maintained by the Secretary of the Interior."]]},{"d":2,"s":[["=","(2) Amounts in the Armed Forces Retirement Home Trust Fund, which consists primarily of deductions from the pay of members of the Armed Forces, are insufficient to both maintain and operate the Retirement Home for the benefit of the residents of the Retirement Home and adequately maintain, repair, and preserve these historic buildings and grounds."]]},{"d":2,"s":[["=","(3) Other sources of funding are available to contribute to the maintenance, repair, and preservation of these historic buildings and grounds."]]},{"d":1,"s":[["=","(b) Authority to accept assistance"]]},{"d":1,"s":[["=","The Chief Operating Officer and the Administrator of the Armed Forces Retirement Home—Washington may apply for and accept a direct grant from the Secretary of the Interior under section"],["-","470a(e)(3)"],["+","302904"],["=","of title"],["-","16"],["+","54"],["=","for the purpose of maintaining, repairing, and preserving the historic buildings and grounds of the Armed Forces Retirement Home—Washington included on the National Register of Historic Places."]]},{"d":1,"s":[["=","(c) Requirements and limitations"]]},{"d":1,"s":[["=","Amounts received as a grant under subsection (b)"],["-","of this section"],["=","shall be deposited in the Fund, but shall be kept separate from other amounts in the Fund. The amounts received may only be used for the purpose specified in subsection"],["-","(b) of this section."],["+","(b)."]]}]}],"net_redline":null,"rank":37},{"title":"24","identifier":"/us/usc/t24/s225b","num":"§ 225b.","heading":"Development of plan for mental health system for the District","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":6,"text_versions":2,"text_changes":1,"churn":10,"substantive_churn":10,"substantive_changes":1,"editorial_changes":0,"inserted":5,"deleted":5,"net_churn":10,"words_first":1419,"words_last":1419,"relative_churn":0.007,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":1419},{"release":"117-327not263","date":"2022-12-27","kind":"text","status":null,"attribution":"classified","laws":["1 ures described in subsection (k) at or before the time at which the debtor signed the agreement;"]]},{"d":2,"s":[["=","(3) such agreement has been filed with the court and, if applicable, accompanied by a declaration or an affidavit of the attorney that represented the debtor during the course of negotiating an agreement under this subsection, which states that—"]]},{"gap":10},{"d":4,"s":[["=","(ii) in the best interest of the debtor."]]},{"d":3,"s":[["=","(B) Subparagraph (A) shall not apply to the extent that such debt is a consumer debt secured by real property."]]},{"d":1,"s":[["=","(d) In a case concerning an individual, when the court has determined whether to grant or not to grant a discharge under section 727, 1141,"],["+","1192,"],["=","1228, or 1328 of this title, the court may hold a hearing at which the debtor shall appear in person. At any such hearing, the court shall inform the debtor that a discharge has been granted or the reason why a discharge has not been granted. If a discharge has been granted and if the debtor desires to make an agreement of the kind specified in subsection (c) of this section and was not represented by an attorney during the course of negotiating such agreement, then the court shall hold a hearing at which the debtor shall appear in person and at such hearing the court shall—"]]},{"d":2,"s":[["=","(1) inform the debtor—"]]},{"d":3,"s":[["=","(A) that such an agreement is not required under this title, under nonbankruptcy law, or under any agreement not made in accordance with the provisions of subsection (c) of this section; and"]]},{"gap":156},{"d":2,"s":[["=","(1) Until 60 days after an agreement of the kind specified in subsection (c) is filed with the court (or such additional period as the court, after notice and a hearing and for cause, orders before the expiration of such period), it shall be presumed that such agreement is an undue hardship on the debtor if the debtor’s monthly income less the debtor’s monthly expenses as shown on the debtor’s completed and signed statement in support of such agreement required under subsection (k)(6)(A) is less than the scheduled payments on the reaffirmed debt. This presumption shall be reviewed by the court. The presumption may be rebutted in writing by the debtor if the statement includes an explanation that identifies additional sources of funds to make the payments as agreed upon under the terms of such agreement. If the presumption is not rebutted to the satisfaction of the court, the court may disapprove such agreement. No agreement shall be disapproved without notice and a hearing to the debtor and creditor, and such hearing shall be concluded before the entry of the debtor’s discharge."]]},{"d":2,"s":[["=","(2) This subsection does not apply to reaffirmation agreements where the creditor is a credit union, as defined in section 19(b)(1)(A)(iv) of the Federal Reserve Act."]]}]}],"net_redline":null,"rank":41},{"title":"24","identifier":"/us/usc/t24/s420","num":"§ 420.","heading":"Disposition of effects of deceased persons; unclaimed property","status_now":null,"first_release":"113-21","first_date":"2013-07-18","last_release":"119-121","last_seq":390,"version_groups":6,"text_versions":3,"text_changes":2,"churn":19,"substantive_churn":2,"substantive_changes":1,"editorial_changes":1,"inserted":2,"deleted":17,"net_churn":19,"words_first":1035,"words_last":1020,"relative_churn":0.0184,"repeal_in_window":false,"versions":[{"release":"113-21","date":"2013-07-18","kind":"initial","status":null,"attribution":"none","laws":[],"words":1035},{"release":"113-296not287","date":"2014-12-19","kind":"text","status":null,"attribution":"none","laws":[],"words":1020},{"release":"115-269not254","date":"2018-10-16","kind":"text","status":null,"attribution":"classified","laws":["115-232"],"words":1020}],"transitions":[{"from":"113-21","to":"113-296not287","date":"2014-12-19","inserted":1,"deleted":16,"churn":17,"words_before":1035,"words_after":1020,"status_be s."]]},{"d":2,"s":[["=","(2)"]]},{"d":3,"s":[["=","(A) The Administrator of a facility of the Retirement Home may designate an attorney who is a full-time officer or employee of the United States or a member of the Armed Forces on active duty to serve as attorney or agent for the facility in any probate proceeding in which the Retirement Home may have a legal interest as nominated fiduciary, testamentary legatee, escheat legatee, or in any other capacity."]]},{"d":3,"s":[["=","(B) An attorney designated under this paragraph may, in the domiciliary jurisdiction of the deceased resident and in any ancillary jurisdiction, petition for appointment as fiduciary. The attorney shall have priority over any petitioners (other than the deceased resident’s nominated fiduciary, named legatees, or heirs) to serve as fiduciary. In a probate proceeding in which the heirs of an intestate deceased resident cannot be located and in a probate proceeding in which the nominated fiduciary, legatees, or heirs of a testate deceased resident cannot be located, the attorney shall be appointed as the fiduciary of the deceased resident’s estate."]]},{"d":2,"s":[["=","(3) The designation of an employee or representative of a facility of the Retirement Home as personal representative of the estate of a resident of the Retirement Home or as a legatee under the will or codicil of the resident shall not disqualify an employee or staff member of that facility from serving as a competent witness to a will or codicil of the resident."]]},{"d":2,"s":[["=","(4) After the end of the three-year period beginning on the date of the death of a resident of a facility, the Administrator of the facility shall dispose of all property of the deceased resident that is not otherwise disposed of under this subsection, including personal effects such as decorations, medals, and citations to which a right has not been established under subsection"],["-","(a) of this section."],["+","(a)."],["=","Disposal may be made within the discretion of the Administrator by—"]]},{"d":3,"s":[["=","(A) retaining such property or effects for the facility;"]]},{"d":3,"s":[["=","(B) offering such items to the Secretary of Veterans Affairs, a State, another military home, a museum, or any other institution having an interest in such items; or"]]},{"d":3,"s":[["=","(C) destroying any items determined by the Administrator to be valueless."]]},{"d":1,"s":[["=","(c) Transfer of proceeds to Fund"]]},{"d":1,"s":[["=","The net proceeds received by the Administrators from the sale of effects under subsection (b)"],["-","of this section"],["=","shall be deposited in the Fund."]]},{"d":1,"s":[["=","(d) Subsequent claim"]]},{"d":2,"s":[["=","(1) A claim for the net proceeds of the sale under subsection (b)"],["-","of this section"],["=","of the effects of a deceased may be filed with the Secretary of Defense at any time within six years after the death of the deceased, for action under section 2771 of title 10."]]},{"d":2,"s":[["=","(2) A claim referred to in paragraph (1) may not be considered by a court or the Secretary unless the claim is filed within the time period prescribed in such paragraph."]]},{"d":2,"s":[["=","(3) A claim allowed by the Secretary under paragraph (1) shall be certified to the Secretary of the Treasury for payment from the Fund in the amount found due, including any interest relating to the amount. No claim may be allowed or paid in excess of the net proceeds of the estate deposited in the Fund under subsection (c)"],["-","of this section"],["=","plus interest."]]},{"d":1,"s":[["=","(e) Unclaimed property"]]},{"d":1,"s":[["=","In the case of property delivered to the Retirement Home under section 2575 of title 10, the Administrator of the facility shall deliver the property to the owner, the heirs or next of kin of the owner, or the legal representative of the owner, if a right to the property is established to the satisfaction of the Administrator of the facility within two years after the delivery."]]}]},{"from":"113-296not287","to":"115-269not254","date":"2018-10-16","inserted":1,"deleted":1,"churn":2,"words_before":1020,"words_after":1020,"status_before":null,"status_after":null,"attribution":"classified","laws":["115-232"],"caveat":"Current through Public Law 115-269 (10/16/2018), except 115-254.","editorial":false,"redline":[{"d":0,"s":[["=","§ 420. Disposition of effects of deceased persons; unclaimed property"]]},{"d":1,"s":[["=","(a) Disposition of effects of deceased persons The Administrator of a facility of the Retirement Home shall safeguard and dispose of the estate and personal effects of deceased residents, including effects delivered to such facility under sections"],["-","4712(f)"],["+","7712(f)"],["=","and 9712(f) of title 10, and shall ensure the following:"]]},{"d":2,"s":[["=","(1) A will or other instrument of a testamentary nature involving property rights executed by a resident shall be promptly delivered, upon the death of the resident, to the proper court of record."]]},{"d":2,"s":[["=","(2) If a resident dies intestate and the heirs or legal representative of the deceased cannot be immediately ascertained, the Administrator shall retain all property left by the decedent for a three-year period beginning on the date of the death. If entitlement to such property is established to the satisfaction of the Administrator at any time during the three-year period, the Administrator shall distribute the decedent’s property, in equal pro-rata shares when multiple beneficiaries have been identified, to the highest following categories of identified survivors (listed in the order of precedence indicated):"]]},{"gap":24},{"d":1,"s":[["=","(e) Unclaimed property"]]},{"d":1,"s":[["=","In the case of property delivered to the Retirement Home under section 2575 of title 10, the Administrator of the facility shall deliver the property to the owner, the heirs or next of kin of the owner, or the legal representative of the owner, if a r html":"\n<p><b>Source.<\/b> The US Code mirror at uscode.linkedlegislation.org (aih/uscode-redesign), which\nholds every OLRC release point from 113-21 (July 2013). For each section its version history\nclassifies every version as initial, text, notes-only or structure-only (ADR-0074) and names the\nPublic Laws the classification tables attribute it to.<\/p>\n<p><b>Text compared.<\/b> The section's statutory text at the first release point of each text\nversion: number, heading, chapeau, content and continuation of every level. Notes, the source\ncredit and footnote markers are left out.<\/p>\n<p><b>Metric.<\/b> For each change, words inserted plus words deleted (a word-level diff). A\nsection's score is the sum over its changes, leaving out editorial changes that only add or drop\n“of this section”, “of this title” and the like. “Net” compares the first text with the latest; it\nis smaller where a temporary provision was added and later expired.<\/p>\n<p><b>Limits.<\/b> Nothing before July 2013 is seen, so the Bankruptcy Abuse Prevention and\nConsumer Protection Act of 2005 is outside the window. Sections first enacted inside the window\n(title 11, subchapter V of chapter 11) count from their first text. Two laws reaching the Code\nbetween the same two release points are one change. Repealed ranges of title 24 with no text of\ntheir own are skipped.<\/p>\n<p><b>Rerun.<\/b> <code>python3 -m tools.textchange.fetch 11 24<\/code>, then\n<code>analyze 11 24<\/code> and <code>render<\/code>, in aih/free-standing-law\n(<code>tools/textchange/README.md<\/code>).<\/p>\n"};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n.toLocaleString("en-US");
const T0 = Date.parse("2013-01-01"), T1 = Date.parse("2027-01-01");
const xFrac = d => (Date.parse(d) - T0) / (T1 - T0);
const YEARS = [2014, 2017, 2020, 2023, 2026];
const TOP = DATA.top;
const maxChurn = Math.max(...TOP.flatMap(r => r.transitions.map(t => t.churn)));
const slug = r => `t${r.title}-${r.identifier.split("/").pop()}`;
const cite = r => `${r.title} U.S.C. ${r.identifier.split("/").pop().replace(/^s/, "§ ")}`;
const tip = $("#tip");
function showTip(e, html) { tip.innerHTML = html; tip.hidden = false; const x = Math.min(e.clientX + 12, innerWidth - 270); tip.style.left = x + "px"; tip.style.TOP = (e.clientY + 14) + "px"; }
function hideTip() { tip.hidden = true; }

// facts
const s = DATA.summary;
$("#facts").innerHTML = Object.entries(s).map(([t, v]) =>
  `<div><b>${fmt(v.sections_with_substantive_change)} of ${fmt(v.sections)}</b>sections of title ${t} with a text change</div>
   <div><b>${fmt(v.substantive_churn_words)}</b>words changed in title ${t}</div>`).join("") +
  `<div><b>${DATA.window.from} – ${DATA.window.to}</b>release points compared</div>`;

$("#ticks").innerHTML = YEARS.map(y => `<span style="left:${xFrac(y + "-01-01") * 100}%">${y}</span>`).join("");

function spark(r) {
  const W = 150, H = 22;
  const marks = r.transitions.map(t => {
    const x = 3 + xFrac(t.date) * (W - 6);
    const h = Math.max(3, Math.sqrt(t.churn / maxChurn) * (H - 2));
    return `<rect x="${(x - 2).toFixed(1)}" y="${(H - h).toFixed(1)}" width="4" height="${h.toFixed(1)}" rx="1" fill="var(--heat)"/>`;
  }).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${H - .5}" y2="${H - .5}" stroke="var(--rule)"/>${marks}</svg>`;
}

let filter = "all", current = null;
function renderRows() {
  const rows = TOP.filter(r => filter === "all" || r.title === filter);
  $("#rows").innerHTML = rows.map(r => `
    <button type="button" class="row" id="row-${slug(r)}" data-slug="${slug(r)}" aria-current="${current === slug(r)}">
      <span class="rank">${r.rank}</span>
      <span class="who"><div class="cite t${r.title}"><span class="t">T${r.title}</span>${esc(r.identifier.split("/").pop().replace(/^s/, "§ "))}</div>
        <div class="hd">${esc(r.heading)}</div></span>
      <span class="num">${fmt(r.substantive_churn)}</span>
      ${spark(r)}
    </button>`).join("") || `<p class="note" style="padding:14px">No sections of this title are in the TOP 50.</p>`;
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderRows();
}));
$("#rows").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) location.hash = b.dataset.slug; });

function redlineHTML(rows) {
  return rows.map(row => {
    if (row.gap) return `<div class="gap">${fmt(row.gap)} unchanged ${row.gap === 1 ? "line" : "lines"}</div>`;
    const body = row.s.map(([op, t]) => op === "+" ? `<ins>${esc(t)}</ins>` : op === "-" ? `<del>${esc(t)}</del>` : esc(t)).join(" ");
    return `<p style="padding-left:${Math.min(row.d, 7) * 1.4}em">${body}</p>`;
  }).join("");
}

function timeline(r) {
  const W = 800, H = 92, L = 10, R = 10, base = 60;
  const xs = d => L + xFrac(d) * (W - L - R);
  const maxT = Math.max(...r.transitions.map(t => t.churn), 1);
  const yearTicks = [];
  for (let y = 2013; y <= 2026; y++) yearTicks.push(`<line x1="${xs(y + "-01-01")}" x2="${xs(y + "-01-01")}" y1="${base}" y2="${base + 4}" stroke="var(--ink-3)"/>` +
    (y % 2 === 1 ? `<text x="${xs(y + "-01-01")}" y="${base + 18}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${y}</text>` : ""));
  const first = r.versions[0];
  const bars = r.transitions.map((t, i) => {
    const x = xs(t.date), h = Math.max(4, (t.churn / maxT) * (base - 14));
    const ih = h * t.inserted / Math.max(t.churn, 1);
    return `<g class="tl-mark" data-i="${i}" style="cursor:pointer">
      <rect x="${x - 14}" y="0" width="28" height="${base + 4}" fill="transparent"/>
      <rect x="${x - 5}" y="${base - h}" width="10" height="${(h - ih).toFixed(1)}" rx="2" fill="var(--del)"/>
      <rect x="${x - 5}" y="${(base - ih).toFixed(1)}" width="10" height="${ih.toFixed(1)}" rx="0" fill="var(--ins)"/>
      <text x="${x}" y="${base - h - 4}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace">${fmt(t.churn)}</text></g>`;
  }).join("");
  return `<svg class="timeline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Words changed at each release point">
    <line x1="${L}" x2="${W - R}" y1="${base}" y2="${base}" stroke="var(--rule)" stroke-width="1.5"/>
    ${yearTicks.join("")}
    <circle cx="${xs(first.date)}" cy="${base}" r="4" fill="var(--sheet)" stroke="var(--ink-3)" stroke-width="1.5"/>
    ${bars}</svg>`;
}

function showDetail(r, which) {
  const ts = r.transitions;
  if (which == null) which = ts.reduce((best, t, i) => t.churn > ts[best].churn ? i : best, 0);
  const tabs = ts.map((t, i) => `<button type="button" class="tab" data-w="${i}" aria-pressed="${which === i}">${esc(t.to)} <small>${t.editorial ? "editorial" : fmt(t.churn)}</small></button>`).join("") +
    (r.net_redline ? `<button type="button" class="tab" data-w="net" aria-pressed="${which === "net"}">${esc(r.versions[0].release)} → ${esc(r.versions.at(-1).release)} <small>net</small></button>` : "");
  let head, body;
  if (which === "net") {
    head = `First text held (${esc(r.versions[0].release)}, ${esc(r.versions[0].date)}) against the latest (${esc(r.versions.at(-1).release)}, ${esc(r.versions.at(-1).date)}): <b>${fmt(r.net_churn)}</b> words changed net, against <b>${fmt(r.churn)}</b> counted change by change.`;
    body = r.net_redline;
  } else {
    const t = ts[which];
    const laws = t.laws.length ? t.laws.map(l => `<span class="law">Pub. L. ${esc(l.replace("-", "–"))}</span>`).join("") : `<span class="note">no classifying law recorded</span>`;
    head = `<b>${esc(t.from)}</b> → <b>${esc(t.to)}</b> (release point of ${esc(t.date)}): <b>${fmt(t.inserted)}</b> words inserted, <b>${fmt(t.deleted)}</b> deleted. ${laws}` +
      (t.status_after !== t.status_before ? ` <span class="law">status: ${esc(t.status_before || "in force")} → ${esc(t.status_after || "in force")}</span>` : "") +
      (t.editorial ? ` <span class="law">editorial: “of this …” only, not counted</span>` : "") +
      (t.caveat ? `<div class="note">${esc(t.caveat)}</div>` : "");
    body = t.redline;
  }
  const url = `https://uscode.linkedlegislation.org/app${r.identifier}`;
  $("#detail").innerHTML = `
    <h2>Rank ${r.rank} of ${TOP.length}</h2>
    <h3>${esc(cite(r))}. ${esc(r.heading)}</h3>
    <div class="meta"><span>${fmt(r.text_changes)} text ${r.text_changes === 1 ? "change" : "changes"}</span><span>${fmt(r.words_first)} → ${fmt(r.words_last)} words</span>
      <span>${fmt(r.inserted)} inserted, ${fmt(r.deleted)} deleted</span><a href="${url}/versions" target="_blank" rel="noopener">version history on the US Code mirror</a></div>
    ${timeline(r)}
    <div class="legend"><span><i style="background:var(--del-bg);color:var(--del)">■</i> words deleted</span><span><i style="background:var(--ins-bg);color:var(--ins)">■</i> words inserted</span><span>○ first text held</span></div>
    <div class="tabs" role="group" aria-label="Choose a change">${tabs}</div>
    <p class="change-head">${head}</p>
    <div class="text">${redlineHTML(body)}</div>`;
  $("#detail").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showDetail(r, b.dataset.w === "net" ? "net" : +b.dataset.w)));
  $("#detail").querySelectorAll(".tl-mark").forEach(g => {
    const t = ts[+g.dataset.i];
    g.addEventListener("mousemove", e => showTip(e, `<b>${esc(t.to)}</b> · ${esc(t.date)}<br>${fmt(t.inserted)} inserted, ${fmt(t.deleted)} deleted${t.laws.length ? "<br>Pub. L. " + t.laws.map(l => l.replace("-", "–")).join(", ") : ""}`));
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("click", () => showDetail(r, +g.dataset.i));
  });
}

function route() {
  const h = location.hash.slice(1);
  const r = TOP.find(x => slug(x) === h) || TOP[0];
  current = slug(r);
  if (filter !== "all" && r.title !== filter) { filter = "all"; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === "all")); }
  renderRows();
  showDetail(r);
}
addEventListener("hashchange", route);
$("#method-body").innerHTML = DATA.method_html;
$("#lede").textContent = `The ${TOP.length} sections whose statutory text changed by the most words between release points ${DATA.window.from} (2013) and ${DATA.window.to} (2026) of the US Code, with a word-level redline for every change. ${TOP.length < 50 ? `Only ${TOP.length} sections of the two titles had any substantive text change in that period, so the list stops at ${TOP.length}.` : ""}`;
route();
</script>
